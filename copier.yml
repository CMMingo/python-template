project_name:
  type: str
  help: Project name (lowercase letters, digits and underscores)
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    Use lowercase letters, digits and underscores, starting with a letter.
    {% endif %}

description:
  type: str
  help: Short description of the project
  default: ""

python_version:
  type: str
  help: Minimum Python version
  default: "3.12"

open_source_license:
  type: str
  help: License
  default: MIT
  choices: [MIT, Apache-2.0, GPL-3.0, None]

project_layout:
  type: str
  help: Project layout
  default: simple
  choices:
    "Simple: package and tests at the repo root": simple
    "Product: backend/, frontend/ and infra/, each with its own tests": product

use_ml:
  type: bool
  help: Is this an ML / data project? (adds DVC, notebooks/, data/, runs/, results/)
  default: false

# ---- derived (never asked) ----
# Where the Python project lives, and the importable package name.
py_root:
  type: str
  when: false
  default: "{{ 'backend/' if project_layout == 'product' else '' }}"

package_name:
  type: str
  when: false
  default: "{{ 'app' if project_layout == 'product' else project_name }}"

# ---- internal ----
# ---- internal ----
_subdirectory: template

# The template's own README.md and docs sit outside `template/`, so they are never copied.

# Dependencies are not listed in pyproject.toml by the template: scripts/resolve-latest.sh resolves the
# latest versions at generation time and pins them exactly (uv.lock is committed), and bumps the
# pre-commit hook revisions. Needs network and `copier copy --trust`. The task runs only on `copy`, never on
# `copier update`, and the script skips itself with a warning when uv is missing
# (scripts/setup.sh retries later). The frontend is not scaffolded: see frontend/decide-frontend-style.md.
_tasks:
  - command: bash scripts/resolve-latest.sh
    # Only when the project is first generated. During `copier update` Copier regenerates the project in
    # temporary folders to compute a diff; running this there produced different dependency pins and the
    # merge then removed the project's own.
    when: "{{ _copier_operation == 'copy' }}"

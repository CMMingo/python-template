# Renders every layout of the template and checks the generated projects (see check-template.sh).
# This tests the template repo itself; it is not copied into generated projects.
name: Test template

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Render and check every layout
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.12.23/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0

      - name: Check the template
        run: bash check-template.sh
